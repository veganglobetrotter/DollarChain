name: CI / Build → Push → Deploy → Smoke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

jobs:
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: echo "image_tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (sha & latest)
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest
          file: ./Dockerfile
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  deploy-and-smoke:
    name: Deploy to ECS (via SSH) and run smoke tests
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ECS_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Pull image & restart container on ECS
        run: |
          IMAGE_TAG=${{ steps.set-tag.outputs.image_tag }}
          IMAGE_FULL="${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"
          ssh -o StrictHostKeyChecking=yes "${{ secrets.ECS_SSH_USER }}"@"${{ secrets.ECS_SSH_HOST }}" <<'SSH_EOF'
            set -e
            docker pull $IMAGE_FULL || true
            docker stop dollarchain-backend || true
            docker rm dollarchain-backend || true
            docker run -d --name dollarchain-backend --restart unless-stopped -p 5000:5000 $IMAGE_FULL
            sleep 4
            docker ps --filter name=dollarchain-backend --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
SSH_EOF

      - name: Run smoke tests (SKIP_UPLOAD=1)
        env:
          API_BASE: https://api.dollarchain.store
          ADMIN_TOKEN: ${{ secrets.SMOKE_ADMIN_TOKEN }}
        run: |
          chmod +x ./run_smoke_tests.sh
          SKIP_UPLOAD=1 ./run_smoke_tests.sh

